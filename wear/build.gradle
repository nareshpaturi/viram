// Viram for Wear OS (research gap 4): a companion that runs a practice on
// the watch, wrist down, guided by haptics alone. plugins/withWearApp.js
// includes this module in the generated Android project; it builds its own
// APK, published alongside the phone app under the same package name.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'app.viram.wear'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    // The Data Layer only connects apps with the same package and signature.
    applicationId 'app.viram'
    // Wear OS 3 and later.
    minSdk 30
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 1
    versionName '1.0.0'
  }

  signingConfigs {
    debug {
      // The phone app's debug key (android/app/debug.keystore), so debug builds can talk.
      storeFile file("${rootProject.projectDir}/app/debug.keystore")
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      // Signed by the same release key as the phone app at publish time.
      signingConfig signingConfigs.debug
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.wear:wear:1.3.0'
  implementation 'androidx.wear:wear-ongoing:1.0.0'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
