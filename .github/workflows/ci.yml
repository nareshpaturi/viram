# Every pull request runs the checks (delivery plan D01, CP0).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, content, theme, audio manifest, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    name: Android debug build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Merged manifest has mediaPlayback, write-only Health, and no microphone permission
        run: |
          manifest=$(find android/app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$manifest"
          if grep -q 'RECORD_AUDIO' "$manifest"; then echo "The manifest asks for the microphone"; exit 1; fi
          # FR-18: Health Connect may write mindful sessions and nothing else; never read.
          grep -q 'permission.health.WRITE_MINDFULNESS' "$manifest"
          ! grep -E 'permission\.health\.' "$manifest" | grep -v 'WRITE_MINDFULNESS'
      - name: Wear OS app built alongside, with nothing beyond its own permissions
        run: |
          test -f wear/build/outputs/apk/debug/wear-debug.apk
          wear=$(find wear/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          grep -q 'android.hardware.type.watch' "$wear"
          ! grep -E 'RECORD_AUDIO|permission\.health\.|ACCESS_FINE_LOCATION|BODY_SENSORS' "$wear"
      - uses: actions/upload-artifact@v4
        with:
          name: viram-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk

  ios:
    name: iOS simulator build
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Info.plist has background audio, write-only Health, and no microphone purpose string
        run: |
          grep -q "<string>audio</string>" ios/Viram/Info.plist
          if grep -q NSMicrophoneUsageDescription ios/Viram/Info.plist; then echo "Info.plist asks for the microphone"; exit 1; fi
          # FR-18: Apple Health may be written (mindful sessions) and never read. App Store
          # Connect still requires the read purpose string with the HealthKit entitlement
          # (ITMS-90683), so it must say Viram doesn't read, and the module must ask to read nothing.
          grep -q "NSHealthUpdateUsageDescription" ios/Viram/Info.plist
          grep -A1 "NSHealthShareUsageDescription" ios/Viram/Info.plist | grep -q "doesn't read"
          if grep -q NSHealthClinicalHealthRecordsShareUsageDescription ios/Viram/Info.plist; then echo "Info.plist asks for health records"; exit 1; fi
          grep -q "read: nil" modules/viram-health/ios/ViramHealthModule.swift
      # Builds the app with its widget (targets/widget). The Apple Watch app isn't in 1.0:
      # app.json's @bacons/apple-targets "match" leaves it out, so no watchOS platform is needed.
      - name: No Apple Watch app in 1.0
        run: '! grep -q ViramWatch ios/Viram.xcodeproj/project.pbxproj'
      - run: |
          xcodebuild -workspace ios/Viram.xcworkspace -scheme Viram -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
