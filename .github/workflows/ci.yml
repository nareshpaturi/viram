# Every pull request runs the checks (delivery plan D01, CP0).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, content, theme, audio manifest, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    name: Android debug build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Merged manifest has mediaPlayback, write-only Health, and no microphone permission
        run: |
          manifest=$(find android/app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$manifest"
          ! grep -E 'RECORD_AUDIO' "$manifest"
          # FR-18: Health Connect may write mindful sessions and nothing else; never read.
          grep -q 'permission.health.WRITE_MINDFULNESS' "$manifest"
          ! grep -E 'permission\.health\.' "$manifest" | grep -v 'WRITE_MINDFULNESS'
      - name: Wear OS app built alongside, with nothing beyond its own permissions
        run: |
          test -f wear/build/outputs/apk/debug/wear-debug.apk
          wear=$(find wear/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          grep -q 'android.hardware.type.watch' "$wear"
          ! grep -E 'RECORD_AUDIO|permission\.health\.|ACCESS_FINE_LOCATION|BODY_SENSORS' "$wear"
      - uses: actions/upload-artifact@v4
        with:
          name: viram-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk

  ios:
    name: iOS simulator build
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Info.plist has background audio, write-only Health, and no microphone purpose string
        run: |
          grep -q "<string>audio</string>" ios/Viram/Info.plist
          ! grep -E "NSMicrophoneUsageDescription" ios/Viram/Info.plist
          # FR-18: Apple Health may be written (mindful sessions) and never read.
          grep -q "NSHealthUpdateUsageDescription" ios/Viram/Info.plist
          ! grep -E "NSHealthShareUsageDescription|NSHealthClinicalHealthRecordsShareUsageDescription" ios/Viram/Info.plist
      # The embedded Apple Watch app (targets/watch) needs the watchOS platform.
      - name: watchOS platform
        run: xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS
      # Builds the app with its widget and its Apple Watch app (targets/). No -sdk: it would
      # force the watch target onto the iOS SDK; the destination picks each target's simulator SDK.
      - run: |
          xcodebuild -workspace ios/Viram.xcworkspace -scheme Viram -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
